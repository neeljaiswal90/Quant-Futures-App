[project]
name = "realtime_contract"
version = "0.1.0"
description = "v2 realtime dashboard wire contract (RA-067) — Pydantic source of truth + TS mirror + mock emitter."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "websockets>=12",
  "pytest>=7",
  "ruff>=0.1",
  "mypy>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "E501"]
# events.py / __init__.py re-export the public contract surface.
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
