[package]
name = "mnq-dashboard-shell"
version = "0.1.0"
description = "Tauri shell for the MNQ realtime dashboard"
authors = ["Quant Futures"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# RA-115 Phase 1: 'devtools' feature enables F12 / right-click Inspect in
# release builds so we can verify WebGPU init from the running shell.
# (Default Tauri 2 release strips devtools entirely.)
tauri = { version = "2.11.2", features = ["devtools"] }
tauri-plugin-notification = "2.3.3"

