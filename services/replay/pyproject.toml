[project]
name = "replay"
version = "0.1.0"
description = "Offline Rithmic capture replay to detector-firing datasets."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "pytest>=7",
  "ruff>=0.1",
  "mypy>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["replay", "realtime_backend", "rithmic_dashboard", "contracts"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "slow: optional tests against local multi-GB capture artifacts",
]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "..:../..:../../tools/rithmic_dashboard:../../tools/rithmic_analytics"

[[tool.mypy.overrides]]
module = ["realtime_backend.*", "watchdog.*"]
ignore_missing_imports = true
