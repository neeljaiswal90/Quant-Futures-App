# RA-060 realtime backend — lint/type/test config.
#
# This package is run in-place (no install): tests and the server import it as
# the top-level ``realtime_backend`` package with ``services/`` on sys.path
# (the package __init__ also bootstraps the repo root for ``contracts`` and
# ``rithmic_dashboard`` is installed editable). Mirrors the rithmic_dashboard
# ruff/mypy posture so the lead reviews one consistent style.

# Dependencies are RECORDED here (this run-in-place package is not pip-built)
# so the environment is reproducible and not ambient. RA-068 added httpx
# (Starlette TestClient HTTP integration tests) alongside watchdog (the
# capture-tail watcher), mirroring the contracts/realtime declaration style.
[project]
name = "realtime_backend"
version = "0.1.0"
description = "RA-060 realtime WebSocket backend — detectors-as-library over the v2 contract."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "websockets>=12",
  "watchdog>=4",
  "httpx>=0.27",
  "pydantic>=2",
  "pytest>=7",
  "ruff>=0.1",
  "mypy>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["realtime_backend"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
# RA-069: the backend-owned _scratch/ holds runtime output + the gitignored soak
# harness — never source. Keep it out of the type pass (mirrors the package
# .gitignore) so a stray scratch .py can't trip the gate.
exclude = ["_scratch/"]
# Let mypy resolve the cross-package imports the runtime bootstrap provides:
# the repo root (for ``contracts.*``) and the editable rithmic_dashboard
# package dir. These are untyped (no py.typed) so they are followed as source
# but their public symbols still resolve for the Literal/enum checks below.
mypy_path = "..:../tools/rithmic_dashboard"

[[tool.mypy.overrides]]
module = ["watchdog.*", "uvicorn.*"]
ignore_missing_imports = true

# RA-068: app.py now imports realtime_backend.config.* (the mounted RA-063
# router + shared store). config/ has its OWN mypy pass (its pyproject) and
# checks clean there; following into it from the backend pass double-maps the
# files (services.realtime_backend.config.* vs realtime_backend.config.*) under
# explicit_package_bases. Treat config as an opaque import here — it is type-
# checked in its own domain.
[[tool.mypy.overrides]]
module = ["realtime_backend.config.*"]
follow_imports = "skip"
