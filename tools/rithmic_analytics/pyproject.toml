[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rithmic_analytics"
version = "0.1.0"
description = "Rithmic-sourced analytics layer for MNQ futures: volume profile, CVD, footprint, absorption."
readme = "docs/README.md"
requires-python = ">=3.11"
authors = [{ name = "Neel Jaiswal" }]
license = { text = "Proprietary" }
dependencies = [
  "databento==0.75.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=12",
  "plotly>=5.0",
  "matplotlib>=3.7",
  "jsonschema>=4",
  "pytest>=7",
  "ruff>=0.1",
  "mypy>=1.5",
  "pandas-stubs",
  "types-jsonschema",
]

[project.optional-dependencies]
test = [
  "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rithmic_analytics*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
rithmic_analytics = ["core/*.json", "viewer/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["rithmic_analytics"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --basetemp=.pytest_basetemp"
markers = [
  "slow: long-running tests against multi-GB fixtures; self-skips when fixture unavailable",
]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["databento.*", "plotly.*", "matplotlib.*", "pyarrow.*"]
ignore_missing_imports = true
