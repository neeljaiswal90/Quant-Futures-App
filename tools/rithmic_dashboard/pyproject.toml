[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rithmic_dashboard"
version = "0.1.0"
description = "Local MNQ futures prep dashboard generated from rithmic_analytics artifacts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Neel Jaiswal" }]
license = { text = "Proprietary" }
dependencies = [
  "jinja2>=3.1",
  "pytest>=7",
  "ruff>=0.1",
  "mypy>=1.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rithmic_dashboard*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
rithmic_dashboard = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["rithmic_dashboard"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --basetemp=.pytest_basetemp"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["jinja2.*"]
ignore_missing_imports = true
